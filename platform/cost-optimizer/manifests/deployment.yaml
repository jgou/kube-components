apiVersion: apps/v1
kind: Deployment
metadata:
  name: cost-optimizer-controller-manager
  namespace: cost-optimizer-system
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: cost-optimizer-controller-manager
      containers:
        - name: manager
          image: gouster/cost-optimizer-operator:v0.1.1
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true