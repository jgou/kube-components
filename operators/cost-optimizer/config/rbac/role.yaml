---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ops.gouster.io
  resources:
  - environmentschedules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ops.gouster.io
  resources:
  - environmentschedules/finalizers
  verbs:
  - update
- apiGroups:
  - ops.gouster.io
  resources:
  - environmentschedules/status
  verbs:
  - get
  - patch
  - update
