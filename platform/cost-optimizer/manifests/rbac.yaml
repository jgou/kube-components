apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cost-optimizer-manager-role
rules:
  # Permisos para gestionar Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Permisos para gestionar tu Custom Resource
  - apiGroups: ["ops.gouster.io"]
    resources: ["environmentschedules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ops.gouster.io"]
    resources: ["environmentschedules/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cost-optimizer-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cost-optimizer-manager-role
subjects:
  - kind: ServiceAccount
    name: cost-optimizer-controller-manager
    namespace: cost-optimizer-system