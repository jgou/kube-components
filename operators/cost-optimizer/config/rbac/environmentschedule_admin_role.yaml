# This rule is not used by the project cost-optimizer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over ops.gouster.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cost-optimizer
    app.kubernetes.io/managed-by: kustomize
  name: environmentschedule-admin-role
rules:
- apiGroups:
  - ops.gouster.io
  resources:
  - environmentschedules
  verbs:
  - '*'
- apiGroups:
  - ops.gouster.io
  resources:
  - environmentschedules/status
  verbs:
  - get
