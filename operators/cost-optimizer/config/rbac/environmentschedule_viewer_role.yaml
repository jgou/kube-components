# This rule is not used by the project cost-optimizer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ops.gouster.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cost-optimizer
    app.kubernetes.io/managed-by: kustomize
  name: environmentschedule-viewer-role
rules:
- apiGroups:
  - ops.gouster.io
  resources:
  - environmentschedules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ops.gouster.io
  resources:
  - environmentschedules/status
  verbs:
  - get
