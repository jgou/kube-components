name: Cost-optimizer operator CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'operators/cost-optimizer/**'
      - '.github/workflows/operator-ci-cd.yml'

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Automatically calculate the Docker tag:
      # - For Tags (v1.0.0) -> gouster/cost-optimizer-operator:v1.0.0
      # - For Main (commit) -> gouster/cost-optimizer-operator:main-sha7
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gouster/cost-optimizer-operator
          tags: |
            type=ref,event=tag
            type=sha,event=branch,branch=main,prefix=main-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: operators/cost-optimizer
          file: operators/cost-optimizer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Update Argo CD Deployment Manifest
        run: |
          # Extrae la primera etiqueta generada por metadata-action
          PRIMARY_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          
          echo "Updating deployment manifest with image: ${PRIMARY_TAG}"
          sed -i "s|image: gouster/cost-optimizer-operator:.*|image: ${PRIMARY_TAG}|g" platform/cost-optimizer/manifests/deployment.yaml

      - name: Commit and Push Updated Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore(gitops): update operator image to ${{ steps.meta.outputs.version }} [skip ci]"
          file_pattern: "platform/cost-optimizer/manifests/deployment.yaml"